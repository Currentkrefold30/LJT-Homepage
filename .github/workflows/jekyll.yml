# Build and deploy the Academic Pages site to GitHub Pages.
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_configured: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        continue-on-error: true
        with:
          enablement: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify generated content
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/publications/synlogic/index.html

          for s in \
            "Junteng Liu" \
            "first-year PhD candidate at the HKUST NLP Group" \
            "Personal Details" \
            "Academic Background" \
            "Honors and Awards" \
            "Research Experience" \
            "Skills and Research Expertise" \
            "Contact Information" \
            "Zhiyuan Honor Scholarship" \
            "jliugi@connect.ust.hk" \
            "Vicent0205" \
            "tbK9jl4AAAAJ" \
            "junteng88716710" \
            "SynLogic" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts" \
            "C-Eval" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations"; do
            grep -Fq "$s" _site/index.html || { echo "Missing on About: $s"; exit 1; }
          done

          for s in \
            "SynLogic" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts" \
            "C-Eval" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations" \
            "EMNLP 2024" \
            "ICML 2024" \
            "NeurIPS 2023" \
            "<strong>Junteng Liu</strong>"; do
            grep -Fq "$s" _site/publications/index.html || { echo "Missing on publications index: $s"; exit 1; }
          done

          grep -Fq "Vision4Chart" _site/publications/perception-bottleneck-vlm-chart/index.html
          grep -Fq "Universal_Truthfulness_Hyperplane" _site/publications/universal-truthfulness-hyperplane/index.html
          grep -Fq "GitHub code repository available" _site/publications/synlogic/index.html

          if grep -R -Fq "Paper Title Number" _site/index.html _site/publications; then
            echo "Sample publication content remains in the generated site."
            exit 1
          fi
          if grep -Fq "Academic Pages is a ready-to-fork" _site/index.html; then
            echo "Template About content remains on the home page."
            exit 1
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    if: ${{ needs.build.outputs.pages_configured == 'true' }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
